---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Set the RTPEngine version from the environment
      set_fact:
        rtpengine_version: "{{ lookup('env', 'RTPENGINE_VERSION') }}"

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Install rsyslog and nftables
      package:
        name:
          - rsyslog
          - nftables
        state: present

    - name: Start and enable nftables
      systemd:
        name: nftables
        enabled: true
        state: started

  roles:
    - role: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        rtpengine_timeout: 61
        rtpengine_silent_timeout: 3601
        rtpengine_final_timeout: 7201
      tags:
        - rtpengine
