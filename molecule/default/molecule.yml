---
# Don't symlink the role into ~/.ansible/roles. The converge loads the role by
# path, and the symlink step fails when scenarios run in parallel.
prerun: false
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: rtpengine-${MOLECULE_DISTRO:-ubuntu2404}
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
  env:
    ANSIBLE_VERBOSITY: ${MOLECULE_ANSIBLE_VERBOSITY:-0}
    RTPENGINE_VERSION: ${MOLECULE_RTPENGINE_VERSION:-12.5.1.5}

verifier:
  name: testinfra
  options:
    s: true
    verbose: true
